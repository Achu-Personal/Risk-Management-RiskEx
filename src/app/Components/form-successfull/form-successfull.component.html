<div class="modal-overlay">
  <div class="toast-strip">

    <!-- Icon -->
    <div class="icon-circle">
      {{ isSuccessfull ? '✔' : '✖' }}
    </div>

    <!-- Message -->
    <div class="message">
      {{ message }}
    </div>

    <!-- Close -->
    <button class="close-btn" (click)="close()">Close</button>

  </div>
</div>
