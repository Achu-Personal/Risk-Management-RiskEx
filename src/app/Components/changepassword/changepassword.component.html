<div class="modal-backdrop" *ngIf="isVisible">
  <div class="modal-card">

    <div class="modal-header">
      <div class="header-content">
        <div class="icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2>Change Password</h2>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">

      <div class="form-field">
        <label for="currentPassword">Current Password</label>
        <input
          id="currentPassword"
          type="password"
          formControlName="currentPassword"
          placeholder="Enter your current password"
          required
        />
        <span class="error-message"
          *ngIf="changePasswordForm.get('currentPassword')?.invalid &&
                 changePasswordForm.get('currentPassword')?.touched">
          Current password is required
        </span>
      </div>

      <div class="form-field">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Enter your new password"
          required
        />
        <span class="error-message"
          *ngIf="changePasswordForm.get('newPassword')?.invalid &&
                 changePasswordForm.get('newPassword')?.touched">
          Minimum 8 characters with uppercase, lowercase & number
        </span>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm your new password"
          required
        />
        <span class="error-message"
          *ngIf="changePasswordForm.hasError('mismatch') &&
                 changePasswordForm.get('confirmPassword')?.touched">
          Passwords do not match
        </span>
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
          [disabled]="isSubmitting">
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="changePasswordForm.invalid || isSubmitting">
          <span *ngIf="!isSubmitting">Update Password</span>
          <span *ngIf="isSubmitting" class="loading">
            <span class="spinner"></span>
            Updating...
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
